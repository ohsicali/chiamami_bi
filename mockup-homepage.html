<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Guida di Bi — Homepage Mockup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #1a1a1a; font-family: system-ui, -apple-system, sans-serif;
  }

  .phone {
    width: 390px; height: 844px; background: #fff; border-radius: 48px;
    overflow: hidden; position: relative; box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    border: 8px solid #1a1a1a;
  }

  /* Notch */
  .notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 160px; height: 34px; background: #1a1a1a; border-radius: 0 0 20px 20px; z-index: 100;
  }

  /* Navbar */
  .navbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 50;
    padding: 52px 20px 12px; display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(16px);
  }
  .logo { display: flex; align-items: baseline; gap: 4px; }
  .logo-guida { font-family: 'Georgia', serif; font-style: italic; font-weight: 700; font-size: 18px; color: #FF5757; }
  .logo-bi { font-weight: 800; font-size: 18px; color: #1a1a1a; letter-spacing: -0.5px; }
  .logo-sub { font-size: 9px; color: #999; margin-left: 2px; }
  .flag { font-size: 20px; }

  /* Map */
  .map {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: #f0ece3;
    background-image:
      linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .map::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 60% 40%, rgba(232,225,210,0.8) 0%, rgba(240,236,227,0.4) 50%, transparent 80%);
  }

  /* Map markers */
  .marker {
    position: absolute; z-index: 10;
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    border: 2px solid #fff;
  }
  .marker-red { background: #FF5757; }
  .marker-green { background: #22c55e; color: #fff; font-size: 13px; font-weight: 700; }

  /* Bottom Sheet */
  .sheet {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: #fff; border-radius: 24px 24px 0 0;
    padding: 12px 20px 100px; z-index: 30;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.08);
  }
  .handle {
    width: 36px; height: 4px; background: #e0ddd6; border-radius: 2px;
    margin: 0 auto 14px;
  }

  /* Search */
  .search {
    display: flex; align-items: center; gap: 10px;
    background: #f8f6f1; border: 1.5px solid #eae7e0; border-radius: 14px;
    padding: 11px 16px; margin-bottom: 14px;
  }
  .search svg { color: #bbb; flex-shrink: 0; }
  .search span { color: #bbb; font-size: 14px; }

  /* Categories */
  .categories {
    display: flex; gap: 10px; overflow-x: auto; margin-bottom: 12px;
    padding-bottom: 4px; scrollbar-width: none;
  }
  .categories::-webkit-scrollbar { display: none; }
  .cat {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    flex-shrink: 0; width: 52px; cursor: pointer;
  }
  .cat-circle {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; transition: all 0.2s;
  }
  .cat-label { font-size: 9px; color: #888; font-weight: 500; text-align: center; }

  /* Chips */
  .chips { display: flex; gap: 8px; margin-bottom: 10px; }
  .chip {
    padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
    white-space: nowrap; cursor: pointer; border: 1px solid #e0ddd6;
    background: #fff; color: #555; display: flex; align-items: center; gap: 5px;
  }
  .chip-active { background: #FF5757; color: #fff; border-color: #FF5757; }

  /* Floating button */
  .floating-btn {
    position: absolute; bottom: 102px; left: 50%; transform: translateX(-50%);
    background: #1a1a1a; color: #fff; border: none; border-radius: 24px;
    padding: 10px 22px; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25); z-index: 40; cursor: pointer;
  }

  /* Tab Bar */
  .tabbar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 50;
    height: 78px; background: rgba(255,255,255,0.97);
    backdrop-filter: blur(12px); border-top: 0.5px solid #eae7e0;
    display: flex; align-items: center; justify-content: space-around;
    padding: 0 8px 8px;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    flex: 1; cursor: pointer;
  }
  .tab svg { width: 24px; height: 24px; }
  .tab-label { font-size: 10px; font-weight: 400; color: #bbb; }
  .tab-active .tab-label { color: #FF5757; font-weight: 700; }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">
      <span class="logo-guida">La Guida</span>
      <span class="logo-bi">di Bi</span>
    </div>
    <span class="flag">🇮🇹</span>
  </div>

  <!-- Map -->
  <div class="map">
    <div class="marker marker-red" style="top: 220px; left: 160px;">🍷</div>
    <div class="marker marker-red" style="top: 280px; left: 260px;">🍣</div>
    <div class="marker marker-red" style="top: 310px; left: 120px;">🍝</div>
    <div class="marker marker-green" style="top: 180px; left: 240px;">3</div>
    <div class="marker marker-red" style="top: 260px; left: 60px;">🍸</div>
  </div>

  <!-- Bottom Sheet -->
  <div class="sheet">
    <div class="handle"></div>

    <!-- Search -->
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Cerca ristoranti...</span>
    </div>

    <!-- Categories -->
    <div class="categories">
      <div class="cat">
        <div class="cat-circle" style="background: #FFF5F5;">🍷</div>
        <span class="cat-label">Piemontese</span>
      </div>
      <div class="cat">
        <div class="cat-circle" style="background: #FFF8EE;">🍝</div>
        <span class="cat-label">Italiana</span>
      </div>
      <div class="cat">
        <div class="cat-circle" style="background: #FFF0F0;">🍣</div>
        <span class="cat-label">Giapponese</span>
      </div>
      <div class="cat">
        <div class="cat-circle" style="background: #F0F5FF;">🍸</div>
        <span class="cat-label">Bar</span>
      </div>
      <div class="cat">
        <div class="cat-circle" style="background: #FFFBEE;">🍕</div>
        <span class="cat-label">Pizzeria</span>
      </div>
      <div class="cat">
        <div class="cat-circle" style="background: #F5FFF5;">🥪</div>
        <span class="cat-label">Tramezzini</span>
      </div>
    </div>

    <!-- Chips -->
    <div class="chips">
      <div class="chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>
        Vicino a me
      </div>
      <div class="chip chip-active">🏷️ Scontati (2)</div>
      <div class="chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h18M3 12h12M3 20h6"/></svg>
        Filtri
      </div>
    </div>
  </div>

  <!-- Floating Button -->
  <button class="floating-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    Lista
  </button>

  <!-- Tab Bar -->
  <div class="tabbar">
    <div class="tab tab-active">
      <svg viewBox="0 0 24 24" fill="#FF5757" stroke="#FF5757" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3" fill="#fff" stroke="#fff"/></svg>
      <span class="tab-label">Mappa</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.8"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
      <span class="tab-label">Sconti</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
      <span class="tab-label">Salvati</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.8"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="tab-label">Profilo</span>
    </div>
  </div>
</div>

</body>
</html>
