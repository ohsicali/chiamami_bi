<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Dove mangiare a Torino — I migliori ristoranti consigliati da ChiamamiBi</title>
    <meta name="description" content="Scopri dove mangiare a Torino: i migliori ristoranti, bar e locali consigliati da Bi. La guida personale ai posti che amo davvero." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ChiamamiBi — I posti che amo davvero" />
    <meta property="og:description" content="La tua guida personale ai migliori ristoranti, bar e locali. Scopri i posti che ami davvero, consigliati da chi li conosce." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://chiamamibi.com" />
    <meta property="og:locale" content="it_IT" />

    <!-- Favicon + PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#E8453C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Preconnect to critical 3rd-party origins so DNS+TLS handshake
         starts in parallel with the HTML parse, instead of waiting for
         the first fetch to fire. -->
    <link rel="preconnect" href="https://urcwnontifybzugmmiov.supabase.co" crossorigin />
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <link rel="dns-prefetch" href="https://urcwnontifybzugmmiov.supabase.co" />
    <link rel="dns-prefetch" href="https://api.mapbox.com" />

    <!-- v4 fonts: Poppins (UI), Alfa Slab One (wordmark, self-hosted),
         Caveat (Bi's handwriting). Poppins/Caveat come from Google Fonts via
         the media="print" async trick. Alfa Slab One is served locally
         (public/fonts/alfa-slab-one.woff2) and registered in globals.css —
         self-hosting keeps the wordmark readable on connections where the
         Google Fonts CDN is blocked or slow. -->
    <link rel="preload" href="/fonts/alfa-slab-one.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Caveat:wght@400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Caveat:wght@400&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Caveat:wght@400&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
